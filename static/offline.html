<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · Curso de Machine Learning</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f5ef;
        --surface: #fffdf8;
        --ink: #142033;
        --muted: #5b6779;
        --line: #e4dfd3;
        --accent: #3355c8;
        --accent-ink: #203b9e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1526;
          --surface: #111f34;
          --ink: #eef2f8;
          --muted: #9aa8bc;
          --line: #243652;
          --accent: #7fa0ff;
          --accent-ink: #a8bdff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(700px 360px at 80% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 65%),
          var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 34px 30px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgba(10, 20, 40, 0.12);
        text-align: center;
      }
      .mark {
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(145deg, #0b1526, #1b3a63);
        color: #f6f0e2;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -1px;
      }
      h1 { margin: 0 0 8px; font-size: 25px; letter-spacing: -0.02em; }
      p { margin: 0 0 10px; color: var(--muted); font-size: 14.5px; line-height: 1.65; }
      .hint { font-size: 12.5px; margin-top: 16px; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        margin-top: 18px;
        padding: 0 18px;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        max-width: 100%;
      }
      a:hover { background: var(--accent-ink); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ML</div>
      <h1>Estás sin conexión</h1>
      <p>
        Esta página no estaba guardada en la caché del curso. Las lecciones que ya visitaste
        siguen disponibles sin internet.
      </p>
      <p class="hint">Recupera la conexión y vuelve a intentarlo.</p>
      <a href="/">Volver al curso</a>
    </main>
  </body>
</html>
